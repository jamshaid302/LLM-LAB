# Chroma stores document embeddings. MongoDB stores chat threads and messages.
# From backend/: docker compose up -d

services:
  chroma:
    image: chromadb/chroma:1.4.1
    ports:
      - "8000:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma-data:/data

  mongo:
    image: mongo:7
    # 27018 on the host so this does not collide with another MongoDB already on 27017.
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  chroma-data:
  mongo-data:
